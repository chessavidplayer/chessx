name: CI

on:
  push:
    branches: [ test ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout sources
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.2'
        arch: 'win64_msvc2019_64'
        # We'll skip the manual cache step for now to ensure a clean success first

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Ninja
      run: choco install ninja

    - name: Configure CMake
      # We tell CMake to ignore the missing vcpkg for now; 
      # standard Windows runners usually have zlib or CMake can fetch it.
      run: |
        cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: chessx-windows-binaries
        path: |
          build/*.exe
          build/release/*.exe
